<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Ar. Mico</title>

<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #fae1dd;
}

.container {
  position: relative;
}

.valentines {
  position: relative;
  top: 50px;
  cursor: pointer;
  animation: up 3s linear infinite;
}

.valentines.open {
  animation: none;
}

@keyframes up {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-30px); }
}

/* ================= ENVELOPE ================= */

.envelope {
  position: relative;
  width: 300px;
  height: 200px;
  background-color: #f08080;
}

.envelope:before {
  content: "";
  position: absolute;
  width: 212px;
  height: 212px;
  background-color: #f08080;
  transform: rotate(45deg);
  top: -105px;
  left: 44px;
  border-radius: 30px 0 0 0;
}

.card {
  position: absolute;
  background-color: #eae2b7;
  width: 270px;
  height: 170px;
  top: 10px;
  left: 15px;
  box-shadow: -5px -5px 100px rgba(0,0,0,0.4);
  transition: transform 0.8s ease;
  z-index: 5;
}

.valentines.open .card {
  transform: translateY(-120px);
}

.card:before {
  content: "";
  position: absolute;
  border: 3px dotted #003049;
  width: 240px;
  height: 140px;
  left: 12px;
  top: 12px;
}

.text {
  position: absolute;
  font-family: "Courier New";
  font-size: 20px;
  text-align: center;
  line-height: 24px;
  top: 35px;
  left: 20px;
  width: 230px;
  color: #003049;
}

/* ================= HEART BURST ================= */

.hearts {
  position: absolute;
  left: 140px;
  top: 80px;
  pointer-events: none;
  z-index: 20;
}

.one, .two, .three, .four, .five {
  position: absolute;
  width: 10px;
  height: 10px;
  background: red;
  transform: rotate(-45deg);
  opacity: 0;
}

.one:before, .one:after,
.two:before, .two:after,
.three:before, .three:after,
.four:before, .four:after,
.five:before, .five:after {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  background: red;
  border-radius: 50%;
}

.one:before, .two:before, .three:before, .four:before, .five:before {
  top: -5px;
  left: 0;
}

.one:after, .two:after, .three:after, .four:after, .five:after {
  left: 5px;
  top: 0;
}

/* activate hearts ONLY on open */
.valentines.open .one { animation: burst1 0.9s ease-out forwards 0.3s; }
.valentines.open .two { animation: burst2 1s ease-out forwards 0.3s; }
.valentines.open .three { animation: burst3 1.1s ease-out forwards 0.3s; }
.valentines.open .four { animation: burst4 1s ease-out forwards 0.3s; }
.valentines.open .five { animation: burst5 0.9s ease-out forwards 0.3s; }

@keyframes burst1 {
  from { opacity: 1; transform: translate(0,0) rotate(-45deg) scale(0.3); }
  to   { opacity: 0; transform: translate(-60px,-140px) rotate(-45deg) scale(1.2); }
}

@keyframes burst2 {
  from { opacity: 1; transform: translate(0,0) rotate(-45deg) scale(0.3); }
  to   { opacity: 0; transform: translate(-30px,-160px) rotate(-45deg) scale(1.3); }
}

@keyframes burst3 {
  from { opacity: 1; transform: translate(0,0) rotate(-45deg) scale(0.3); }
  to   { opacity: 0; transform: translate(0,-180px) rotate(-45deg) scale(1.4); }
}

@keyframes burst4 {
  from { opacity: 1; transform: translate(0,0) rotate(-45deg) scale(0.3); }
  to   { opacity: 0; transform: translate(30px,-160px) rotate(-45deg) scale(1.3); }
}

@keyframes burst5 {
  from { opacity: 1; transform: translate(0,0) rotate(-45deg) scale(0.3); }
  to   { opacity: 0; transform: translate(60px,-140px) rotate(-45deg) scale(1.2); }
}

/* ================= FRONT & SHADOW ================= */

.front {
  position: absolute;
  border-right: 180px solid #f4978e;
  border-top: 95px solid transparent;
  border-bottom: 100px solid transparent;
  left: 120px;
  top: 5px;
  z-index: 10;
}

.front:before {
  content: "";
  position: absolute;
  border-left: 300px solid #f8ad9d;
  border-top: 195px solid transparent;
  left: -120px;
  top: -95px;
}

.shadow {
  position: absolute;
  width: 330px;
  height: 25px;
  border-radius: 50%;
  background-color: rgba(0,0,0,0.3);
  top: 265px;
  left: -15px;
  animation: scale 3s linear infinite;
  z-index: -1;
}

@keyframes scale {
  0%,100% { transform: scaleX(1); }
  50% { transform: scaleX(0.85); }
}
</style>
</head>

<body>

<div class="container">
  <div class="valentines" onclick="this.classList.toggle('open')">

    <div class="hearts">
      <div class="one"></div>
      <div class="two"></div>
      <div class="three"></div>
      <div class="four"></div>
      <div class="five"></div>
    </div>

    <div class="envelope">
      <div class="card">
        <div class="text">
          Cheering and rooting for you,<br>
          my Mico!
        </div>
      </div>
    </div>

    <div class="front"></div>
  </div>

  <div class="shadow"></div>
</div>

</body>
</html>
